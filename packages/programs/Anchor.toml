[toolchain]
anchor_version = "0.32.1"

[features]
resolution = true
skip-lint = false
[features.test]
hooked-rooms = ["testing"]

[test]
genesis = []

[programs.devnet]
hooked_rooms = "4iF8DPptdoSYt4BX549pzieaoeCg6x7BwbMEwWF5M2hd"

[programs.localnet]
hooked_rooms = "4iF8DPptdoSYt4BX549pzieaoeCg6x7BwbMEwWF5M2hd"

[registry]
url = "https://api.apr.dev"

[provider]
# Default to the public Solana devnet endpoint. To use Helius / Triton / a custom
# RPC, set ANCHOR_PROVIDER_URL in your shell — never paste an API-keyed URL here,
# Anchor.toml is committed to git.
cluster = "devnet"
wallet = "~/.config/solana/hooked.json"

[scripts]
test = "pnpm ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
